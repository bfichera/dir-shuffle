# Generated by the pi "containerize" skill. Run with:  pic
# (pic = podman compose -f pi-compose.yaml run --rm pi, then ... down)
services:
  pi:
    build:
      context: .
      dockerfile: PiContainerfile
      args:
        PI_VERSION: "1.5.2"
    image: localhost/pi-agent:1.5.2-uv-py315-rust-pdfium
    stdin_open: true
    tty: true
    working_dir: /workdir
    # Bind mounts on a macOS podman machine can't be SELinux-relabeled (:z),
    # so disable labeling for this container instead.
    security_opt:
      - label=disable
    # The podman machine's DNS forwarder never answers IPv6 (AAAA) lookups, so every
    # hostname lookup stalls ~4s waiting for them -> pi request timeouts. Skip AAAA.
    dns_opt:
      - no-aaaa
    volumes:
      - .:/workdir
      # Container-local, writable agent home: trust.json, sessions, caches, and
      # extension state live here, persisted per-project. Host auth.json and
      # sessions are never mounted into the container at all.
      - pi-agent-home:${HOME}/.pi/agent
      # Share host config read-only, at the same absolute paths so settings
      # references still resolve. The agent can't tamper with host config.
      - ${HOME}/.pi/agent/settings.json:${HOME}/.pi/agent/settings.json:ro
      - ${HOME}/.pi/agent/skills:${HOME}/.pi/agent/skills:ro
      - ${HOME}/.pi/agent/prompts:${HOME}/.pi/agent/prompts:ro
      - ${HOME}/.pi/agent/extensions:${HOME}/.pi/agent/extensions:ro
      # The permission-system extension writes logs under its own directory.
      - pi-ext-logs:${HOME}/.pi/agent/extensions/pi-permission-system/logs
      # Container-specific models.json (no secrets): routes anthropic through the
      # key-injecting proxy sidecar instead of exposing the API key in here.
      - ./.pi-container/models.json:${HOME}/.pi/agent/models.json:ro
      # Persist uv's download cache across --rm runs. The venv lives at /opt/venv
      # (UV_PROJECT_ENVIRONMENT), NOT ./.venv, so the host's macOS .venv is untouched.
      - uv-cache:/opt/uv-cache
      # Persist cargo registry + build artifacts across --rm runs.
      - cargo-registry:/opt/cargo/registry
      - cargo-target:/opt/cargo-target
    environment:
      - HOME=${HOME}
      - TERM=${TERM:-xterm-256color}
      - COLORTERM
    depends_on:
      - anthropic-proxy

  # Holds the real Anthropic API key (read from the host's auth.json, which is
  # masked inside the pi container). pi talks to http://anthropic-proxy:8402;
  # Caddy injects x-api-key and forwards to api.anthropic.com. No published
  # ports: only containers on this compose network can reach it.
  anthropic-proxy:
    image: docker.io/library/caddy:2-alpine
    security_opt:
      - label=disable
    volumes:
      - ${HOME}/.pi/agent/skills/containerize/assets/anthropic-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOME}/.pi/agent/auth.json:/run/secrets/pi-auth.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ANTHROPIC_API_KEY="$$(tr -d ' \n\t' </run/secrets/pi-auth.json | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')" exec caddy run --config /etc/caddy/Caddyfile

volumes:
  pi-agent-home:
  pi-ext-logs:
  uv-cache:
  cargo-registry:
  cargo-target:
