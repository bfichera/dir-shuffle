[build-system]
requires = ["maturin>=1.9,<2"]  # 1.9: PEP 639 `license` / `license-files`
build-backend = "maturin"

[project]
name = "dir-shuffle"
description = "Faceted terminal browser for parameter-sweep output trees"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["tui", "terminal", "parameter-sweep", "kitty", "pdf", "viewer"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]
dynamic = ["version"]

[tool.maturin]
bindings = "bin"
strip = true
# CI stages libpdfium and its licenses in packaging/data/data/share/dir-shuffle/ (see
# packaging/fetch-pdfium.sh). The wheel's .data/data/ tree is installed into the
# environment prefix, so the library ends up at <prefix>/share/dir-shuffle/, next to
# <prefix>/bin/dir-shuffle, where the binary looks for it (DESIGN.md §6.1).
data = "packaging/data"
# The sdist needs the (empty) data dir too, or building from it fails. Only `.keep`: a
# glob would also pick up a locally staged libpdfium, and the sdist must not contain one.
include = [
    { path = "packaging/data/data/share/dir-shuffle/.keep", format = "sdist" },
    # musl: link dynamically so libpdfium can be loaded (see the file).
    { path = ".cargo/config.toml", format = "sdist" },
]

[tool.uv]
# Rebuild on `uv tool install .` when the Rust sources change. By default uv only
# watches pyproject.toml and would silently reinstall a stale cached build.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "packaging/data/**/*" },
]
