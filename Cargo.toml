[package]
name = "dir-shuffle"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Faceted terminal browser for parameter-sweep output trees"

[[bin]]
name = "dir-shuffle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
directories = "6"
fast_image_resize = { version = "6", features = ["image"] }
ignore = "0.4"
image = "0.25"
lru = "0.19"
flate2 = "1"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_8125", "image_latest", "thread_safe"] }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
