# Build self-contained wheels (binary + prebuilt PDFium) and publish on tags (DESIGN.md §9).
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DIR_SHUFFLE_PDFIUM_DIR: ${{ github.workspace }}/pdfium/lib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: PDFium for the PDF tests
        run: |
          mkdir -p pdfium
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/pdfium-linux-x64.tgz" | tar xz -C pdfium
      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml version $v"; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       target: aarch64-apple-darwin,      pdfium: mac-arm64,   manylinux: auto }
          - { os: macos-15-intel, target: x86_64-apple-darwin,       pdfium: mac-x64,     manylinux: auto }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  pdfium: linux-x64,   manylinux: auto }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, pdfium: linux-arm64, manylinux: auto }
          # No musl (Alpine) wheels: Rust links musl binaries statically, and a static musl
          # binary cannot dlopen() libpdfium ("Dynamic loading not supported"), so PDFs
          # would never preview. Alpine users build from the sdist instead; see
          # .cargo/config.toml.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage PDFium
        run: packaging/fetch-pdfium.sh ${{ matrix.pdfium }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
